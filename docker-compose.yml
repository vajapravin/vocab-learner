services:
  app:
    build: .
    container_name: vocab-learner
    volumes:
      - .:/workspace
      - vocab-venv:/opt/venv
      - /volume1/homes/vajapravin/dictionary/IMG:/workspace/inbox
      - /volume1/homes/vajapravin/dictionary/MD:/workspace/outbox
    env_file:
      - .env
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: bash
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  vocab-venv:

